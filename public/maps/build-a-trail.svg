  </g>
  <rect x="692" y="716" width="310" height="62" fill="#fffdfa" stroke="#173a3c" stroke-width="3"/>
  <text x="720" y="754" fill="#173a3c" font-family="Consolas, monospace" font-size="18" font-weight="700">DRAG · SNAP · KEEP · EXPORT</text>
</svg>
