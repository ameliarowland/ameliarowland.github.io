<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Build a Trail app preview</title>
  <desc id="desc">Trail-building interface with city controls, an editable orange walking loop, and draggable route vertices.</desc>
  <rect width="1200" height="900" fill="#f3efe4"/>
  <rect x="34" y="34" width="1132" height="832" fill="#fffdfa" stroke="#173a3c" stroke-width="4"/>
  <rect x="34" y="34" width="1132" height="94" fill="#f3efe4" stroke="#173a3c" stroke-width="4"/>
  <text x="70" y="76" fill="#e25f3d" font-family="Consolas, monospace" font-size="18" font-weight="700">MAKE THE ROUTE YOUR OWN</text>
  <text x="70" y="110" fill="#173a3c" font-family="Georgia, serif" font-size="38">Build a Trail</text>
  <rect x="34" y="128" width="384" height="738" fill="#f7f3e8" stroke="#173a3c" stroke-width="4"/>
  <g font-family="Arial, sans-serif" fill="#173a3c">
    <text x="68" y="174" fill="#e25f3d" font-family="Consolas, monospace" font-size="16" font-weight="700">01  CHOOSE A CITY</text>
    <text x="68" y="208" font-size="22" font-weight="700">Where do you want to walk?</text>
    <rect x="68" y="230" width="314" height="54" fill="#fff" stroke="#879a96" stroke-width="2"/>
    <text x="86" y="264" fill="#6e7069" font-size="19">Search any city</text>
    <text x="68" y="332" fill="#e25f3d" font-family="Consolas, monospace" font-size="16" font-weight="700">02  GENERATE</text>
    <text x="68" y="366" font-size="22" font-weight="700">Set the trail length</text>
    <rect x="68" y="390" width="94" height="48" fill="#173a3c"/>
    <rect x="170" y="390" width="94" height="48" fill="#fff" stroke="#879a96" stroke-width="2"/>
    <rect x="272" y="390" width="94" height="48" fill="#fff" stroke="#879a96" stroke-width="2"/>
    <text x="106" y="421" fill="#fffdfa" font-family="Consolas, monospace" font-size="17" font-weight="700">2</text>
    <text x="208" y="421" font-family="Consolas, monospace" font-size="17" font-weight="700">4</text>
    <text x="310" y="421" font-family="Consolas, monospace" font-size="17" font-weight="700">6</text>
    <rect x="68" y="456" width="298" height="58" fill="#173a3c"/>
    <text x="143" y="493" fill="#fffdfa" font-size="20" font-weight="700">Build a Trail</text>
    <text x="68" y="568" fill="#e25f3d" font-family="Consolas, monospace" font-size="16" font-weight="700">03  SHAPE IT</text>
    <text x="68" y="602" font-size="22" font-weight="700">Edit the candidate trail</text>
    <text x="68" y="634" fill="#6e7069" font-size="17">Drag vertices · right-click to remove</text>
    <rect x="68" y="662" width="298" height="52" fill="#fff" stroke="#879a96" stroke-width="2"/>
    <text x="86" y="695" fill="#6e7069" font-size="18">My city trail</text>
    <rect x="68" y="730" width="298" height="58" fill="#2d7277"/>
    <text x="158" y="767" fill="#fffdfa" font-size="20" font-weight="700">Keep trail</text>
  </g>
  <rect x="418" y="128" width="748" height="738" fill="#e9ece6"/>
  <g stroke="#fffdfa" stroke-width="10" opacity="0.92">
    <path d="M454 246H1128M454 354H1128M454 462H1128M454 570H1128M454 678H1128M548 160V830M674 160V830M800 160V830M926 160V830M1052 160V830"/>
